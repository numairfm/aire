[package]
name = "aire"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ced90fc636c4ede05402befc38a63bae7fd741bd" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ced90fc636c4ede05402befc38a63bae7fd741bd", features = ["wayland", "x11"] }
image = "0.25"
smallvec = "1.13"
anyhow = "1.0"
futures = "0.3"
parking_lot = "0.12"
crossbeam-channel = "0.5"
async-channel = "2.3"
async-io = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
notify-rust = "4.11"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { git = "https://github.com/zed-industries/zed.git", rev = "ced90fc636c4ede05402befc38a63bae7fd741bd", features = ["wayland", "x11"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10.1"
ksni = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.19"
muda = "0.15"

[patch."https://github.com/zed-industries/zed.git"]
gpui_linux = { path = "patches/gpui_linux" }
gpui_wgpu = { path = "patches/gpui_wgpu" }
